name: macOS build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    # macos-latest is Apple Silicon (arm64).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal binary arm64 + x86_64)
        run: |
          cmake -S . -B build-macos \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build plug-in and tests
        run: cmake --build build-macos --config Release --parallel

      - name: Run DSP tests
        run: ctest --test-dir build-macos -C Release --output-on-failure

      - name: Locate bundle
        id: bundle
        run: |
          BUNDLE=$(find build-macos -name 'LostTechNoGUI.vst' -maxdepth 3 | head -n 1)
          test -n "$BUNDLE"
          echo "path=$BUNDLE" >> "$GITHUB_OUTPUT"
          lipo -info "$BUNDLE/Contents/MacOS/LostTechNoGUI"
          plutil -lint "$BUNDLE/Contents/Info.plist"
          echo "--- Info.plist"; cat "$BUNDLE/Contents/Info.plist"
          echo "--- bundle tree"; find "$BUNDLE" -exec ls -ld {} \;

      # Apple Silicon refuses unsigned code; ad-hoc signing is enough for local use.
      # Distribution to other machines needs a Developer ID signature and notarization.
      - name: Ad-hoc code sign
        run: |
          codesign --force --deep --sign - "${{ steps.bundle.outputs.path }}"
          codesign --verify --deep --strict --verbose=2 "${{ steps.bundle.outputs.path }}"

      # Set Finder's "bundle" flag so the .vst folder is shown and treated as a
      # package. This is done after signing because it must not change the signature.
      - name: Mark as bundle and package
        run: |
          BUNDLE="${{ steps.bundle.outputs.path }}"
          SetFile -a B "$BUNDLE"
          echo "--- Finder flags / attributes"; xattr -l "$BUNDLE" || true
          mkdir -p dist stage
          ditto "$BUNDLE" stage/LostTechNoGUI.vst
          SetFile -a B stage/LostTechNoGUI.vst
          # A DMG keeps the bundle flag and all metadata intact; the ZIP is a fallback.
          hdiutil create -volname LostTechNoGUI -srcfolder stage -ov -format UDZO dist/LostTechNoGUI-macos.dmg
          ditto -c -k --sequesterRsrc --keepParent stage/LostTechNoGUI.vst dist/LostTechNoGUI-macos.zip
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: LostTechNoGUI-macos
          path: |
            dist/LostTechNoGUI-macos.dmg
            dist/LostTechNoGUI-macos.zip

      # Optional: needs a pluginval build that can load VST 2 plug-ins.
      - name: Validate with pluginval
        continue-on-error: true
        run: |
          curl -sSL -o pluginval.zip \
            https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --repeat 3 \
            --validate-in-process "${{ steps.bundle.outputs.path }}"
