name: macOS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    # macos-latest is Apple Silicon (arm64).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure (universal binary arm64 + x86_64)
        run: cmake --preset macos-universal

      - name: Build plug-ins and tests
        run: cmake --build --preset macos-universal-release --parallel

      - name: Run DSP tests
        run: ctest --test-dir build-macos -C Release --output-on-failure

      - name: Locate bundle
        id: bundle
        run: |
          BUNDLE=$(find build-macos -name 'LostTechNoGUI.vst' -maxdepth 3 | head -n 1)
          test -n "$BUNDLE"
          echo "path=$BUNDLE" >> "$GITHUB_OUTPUT"
          lipo -info "$BUNDLE/Contents/MacOS/LostTechNoGUI"
          plutil -lint "$BUNDLE/Contents/Info.plist"
          echo "--- Info.plist"; cat "$BUNDLE/Contents/Info.plist"
          echo "--- bundle tree"; find "$BUNDLE" -exec ls -ld {} \;

      # Apple Silicon refuses unsigned code; ad-hoc signing is enough for local use.
      # Distribution to other machines needs a Developer ID signature and notarization.
      - name: Ad-hoc code sign
        run: |
          codesign --force --deep --sign - "${{ steps.bundle.outputs.path }}"
          codesign --verify --deep --strict --verbose=2 "${{ steps.bundle.outputs.path }}"

      # Set Finder's "bundle" flag so the .vst folder is shown and treated as a
      # package. This is done after signing because it must not change the signature.
      - name: Mark as bundle and package
        run: |
          BUNDLE="${{ steps.bundle.outputs.path }}"
          SetFile -a B "$BUNDLE"
          echo "--- Finder flags / attributes"; xattr -l "$BUNDLE" || true
          mkdir -p dist stage
          ditto "$BUNDLE" stage/LostTechNoGUI.vst
          SetFile -a B stage/LostTechNoGUI.vst
          # A DMG keeps the bundle flag and all metadata intact; the ZIP is a fallback.
          hdiutil create -volname LostTechNoGUI -srcfolder stage -ov -format UDZO dist/LostTechNoGUI-macos.dmg
          ditto -c -k --sequesterRsrc --keepParent stage/LostTechNoGUI.vst dist/LostTechNoGUI-macos.zip
          # VST3 and CLAP from the JUCE build, ad-hoc signed like the VST 2 bundle.
          JUCE_OUT=build-macos/juce/LostTechJUCE_artefacts/Release
          for B in "$JUCE_OUT/VST3/Lost Technology.vst3" "$JUCE_OUT/CLAP/Lost Technology.clap"; do
            codesign --force --deep --sign - "$B"
            codesign --verify --deep --strict "$B"
          done
          ditto -c -k --sequesterRsrc --keepParent "$JUCE_OUT/VST3/Lost Technology.vst3" dist/LostTech-vst3-macos.zip
          ditto -c -k --sequesterRsrc --keepParent "$JUCE_OUT/CLAP/Lost Technology.clap" dist/LostTech-clap-macos.zip
          cp LICENSE LICENSE-AGPL-3.0.md dist/
          ls -la dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LostTechNoGUI-macos
          path: |
            dist/LostTechNoGUI-macos.dmg
            dist/LostTechNoGUI-macos.zip
            dist/LostTech-vst3-macos.zip
            dist/LostTech-clap-macos.zip
            dist/LICENSE
            dist/LICENSE-AGPL-3.0.md

      # Validate with pluginval (fixed version with checksum)
      - name: Download and validate pluginval
        run: |
          curl -sSL -o pluginval.zip \
            https://github.com/Tracktion/pluginval/releases/download/v1.0.0/pluginval_macOS.zip
          echo "904c077aabedaee9feaae2cb3fb91aeff0b0078c162d7113cd29ac8677485c05  pluginval.zip" \
            | shasum -a 256 -c -
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --version
          ./pluginval.app/Contents/MacOS/pluginval --skip-gui-tests --strictness-level 10 \
            --validate "build-macos/juce/LostTechJUCE_artefacts/Release/VST3/Lost Technology.vst3"

      - name: Validate plug-in with pluginval
        run: |
          BUNDLE="${{ steps.bundle.outputs.path }}"
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --repeat 3 \
            --validate-in-process "$BUNDLE"
