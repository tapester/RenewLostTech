name: Linux build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Linux builds the JUCE VST3 and CLAP only; Windows and macOS build every format.
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install JUCE's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libxi-dev libxrender-dev libxcomposite-dev libxfixes-dev \
            libfreetype-dev libfontconfig1-dev libgl-dev

      - name: Configure
        run: cmake --preset linux-x64

      - name: Build plug-ins and tests
        run: cmake --build --preset linux-x64-release --parallel

      - name: Run tests
        run: ctest --test-dir build-linux --output-on-failure

      - name: Validate the VST3 with pluginval
        run: |
          mkdir pluginval && cd pluginval
          curl -sSL -o pluginval.zip \
            https://github.com/Tracktion/pluginval/releases/download/v1.0.0/pluginval_Linux.zip
          [ "$(cmake -E sha256sum pluginval.zip | cut -d' ' -f1)" = "6c716ad5aed22affa46eb6af626c33574b6b3806bd5d3f792e4f5f57a9ca0cad" ]
          cmake -E tar xf pluginval.zip
          chmod +x pluginval
          ./pluginval --skip-gui-tests --strictness-level 10 \
            --validate "../build-linux/juce/LostTechJUCE_artefacts/Release/VST3/Lost Technology.vst3"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LostTech-linux-x64
          path: |
            build-linux/juce/LostTechJUCE_artefacts/Release/VST3
            build-linux/juce/LostTechJUCE_artefacts/Release/CLAP
            LICENSE
            LICENSE-AGPL-3.0.md
