name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    # Keep this pinned to the image that provides the VS 2022 generator.
    # windows-latest can move to a newer Windows image before its Visual Studio
    # installation is available to CMake's generator discovery.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up CMake
        uses: lukka/get-cmake@a1a8216777d3cbbf5602c73b9ddd3e98257ecdc4 # v4.5.1
        with:
          cmakeVersion: 4.2.0

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Configure x64 Release build
        run: cmake -S . -B build-windows -G "Visual Studio 17 2022" -A x64

      - name: Build plug-ins and tests
        run: cmake --build build-windows --config Release --parallel

      - name: Run DSP tests
        run: ctest --test-dir build-windows -C Release --output-on-failure

      - name: Package plug-ins
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build-windows/Release/LostTech.dll dist/
          Copy-Item build-windows/Release/LostTechNoGUI.dll dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LostTech-windows-x64
          path: dist/*.dll
