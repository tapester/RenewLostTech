name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    # Keep this pinned to the image that provides the VS 2022 generator.
    # windows-latest can move to a newer Windows image before its Visual Studio
    # installation is available to CMake's generator discovery.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 4.2.0

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure x64 Release build
        run: cmake -S . -B build-windows -G "Visual Studio 17 2022" -A x64

      - name: Build plug-ins and tests
        run: cmake --build build-windows --config Release --parallel

      - name: Run DSP tests
        run: ctest --test-dir build-windows -C Release --output-on-failure

      - name: Package plug-ins
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build-windows/Release/LostTech.dll dist/
          Copy-Item build-windows/Release/LostTechNoGUI.dll dist/

      - uses: actions/upload-artifact@v4
        with:
          name: LostTech-windows-x64
          path: dist/*.dll
