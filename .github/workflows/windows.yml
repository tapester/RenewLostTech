name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    # Keep this pinned to the image that provides the VS 2026 generator
    # (the one CMakePresets.json uses). windows-latest can move to another image first.
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up CMake
        uses: lukka/get-cmake@a1a8216777d3cbbf5602c73b9ddd3e98257ecdc4 # v4.5.1
        with:
          cmakeVersion: 4.2.0

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Configure x64 Release build
        run: cmake --preset windows-x64

      - name: Build plug-ins and tests
        run: cmake --build --preset windows-x64-release --parallel

      - name: Run DSP tests
        run: ctest --test-dir build-win64 -C Release --output-on-failure

      - name: Validate the VST3 with pluginval
        shell: bash
        run: |
          mkdir pluginval && cd pluginval
          curl -sSL -o pluginval.zip \
            https://github.com/Tracktion/pluginval/releases/download/v1.0.0/pluginval_Windows.zip
          [ "$(cmake -E sha256sum pluginval.zip | cut -d' ' -f1)" = "27fd7364486a87b9ae36235eba0daa171075567b921eaf2446db4237c5411574" ]
          cmake -E tar xf pluginval.zip
          ./pluginval.exe --skip-gui-tests --strictness-level 10 \
            --validate "../build-win64/juce/LostTechJUCE_artefacts/Release/VST3/Lost Technology.vst3"

      - name: Package plug-ins
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build-win64/Release/LostTech.dll dist/
          Copy-Item build-win64/Release/LostTechNoGUI.dll dist/
          $juce = "build-win64/juce/LostTechJUCE_artefacts/Release"
          Copy-Item -Recurse "$juce/VST3/Lost Technology.vst3" dist/
          Copy-Item "$juce/CLAP/Lost Technology.clap" dist/
          Copy-Item LICENSE, LICENSE-AGPL-3.0.md dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LostTech-windows-x64
          path: dist
